[project]
name = "farewatch"
version = "0.1.0"
description = "Personal fare watcher: collect -> SQLite -> outlier stats -> static HTML"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []                     # stdlib only; `tzdata` recommended on minimal systems

[project.optional-dependencies]
tz = ["tzdata"]

[project.scripts]
farewatch = "farewatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["farewatch", "farewatch.sources"]
